name: pubhealth-rfp-poc
metadata:
  template: pubhealth-rfp-poc@0.0.1

infra:
  provider: bicep
  path: infra
  module: main

services:
  api:
    project: src/api
    language: python
    host: containerapp
    docker:
      context: ../
      path: Dockerfile
  orchestrator:
    project: src/orchestrator
    language: dotnet
    host: containerapp

hooks:
  # preprovision intentionally hard-fails (continueOnError: false): its only
  # job is to stop a broken bot identity from ever reaching Bicep, so letting
  # it continue on error would defeat the entire point.
  preprovision:
    posix:
      shell: sh
      run: scripts/pre-provision.sh
      interactive: true
      continueOnError: false
  postdeploy:
    posix:
      shell: sh
      run: scripts/post-deploy.sh
      interactive: true
      continueOnError: true
    windows:
      shell: pwsh
      run: scripts/post-deploy.ps1
      interactive: true
      continueOnError: true
  # postprovision must NOT hard-fail: none of its steps (data uploads, search
  # ingestion, AI Foundry/Fabric info, bot identity check, .env write) are
  # required for the actual deploy phase or the postdeploy hook (which wires
  # the Bot Service endpoint and proves the bot works end to end). Before this
  # was continueOnError: true, a single flaky blob upload or ingestion error
  # silently aborted the ENTIRE `azd up` before deploy or postdeploy ever ran —
  # containers never got redeployed and the bot endpoint never got rewired,
  # with no obvious link between "ingestion failed" and "bot is broken again".
  # Every step in post-provision.sh is independently safe to re-run (see
  # scripts/post-provision.sh), so a partial failure here should be loud but
  # never block the rest of `azd up`.
  postprovision:
    posix:
      shell: sh
      run: scripts/post-provision.sh
      interactive: true
      continueOnError: true
    windows:
      shell: pwsh
      run: scripts/post-provision.ps1
      interactive: true
      continueOnError: true
