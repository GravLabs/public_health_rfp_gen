name: pubhealth-rfp-poc
metadata:
  template: pubhealth-rfp-poc@0.0.1

infra:
  provider: bicep
  path: infra
  module: main

services:
  api:
    project: src/api
    language: python
    host: containerapp
    docker:
      context: ../
      path: Dockerfile
  orchestrator:
    project: src/orchestrator
    language: dotnet
    host: containerapp

hooks:
  preprovision:
    posix:
      shell: sh
      run: scripts/pre-provision.sh
      interactive: true
      continueOnError: false
  postdeploy:
    posix:
      shell: sh
      run: scripts/post-deploy.sh
      interactive: true
      continueOnError: true
    windows:
      shell: pwsh
      run: scripts/post-deploy.ps1
      interactive: true
      continueOnError: true
  postprovision:
    posix:
      shell: sh
      run: scripts/post-provision.sh
      interactive: true
      continueOnError: false
    windows:
      shell: pwsh
      run: scripts/post-provision.ps1
      interactive: true
      continueOnError: false
